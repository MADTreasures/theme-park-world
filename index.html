<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rummelinsel 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D stage. Marquee strip on top, a tray of admission tickets docked at the bottom, enamel-sign panels float over the park. */
  --ink:#171a42; --ink-2:#232861; --ink-3:#3b4294; --ink-soft:rgba(23,26,66,.88);
  --bulb:#ffd447; --bulb-deep:#c9940a;
  --candy:#ff4f64; --candy-deep:#b9243a;
  --mint:#3ddbb4; --mint-deep:#14957a;
  --paper:#fff6dc; --paper-2:#f0e0b4; --paper-ink:#2a2350;
  --sky:#8fd3ff; --veil:rgba(12,14,44,.6); --drop:rgba(12,14,44,.4);
  --font-display:"Bungee","Impact","Arial Black",system-ui,sans-serif;
  --font-ui:"Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;background:var(--sky);color:var(--paper);font:700 14px/1.3 var(--font-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
svg{display:block}

#app{position:relative;height:100%;overflow:hidden;background:var(--sky)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#stage.build{cursor:crosshair}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}

/* marquee strip */
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-left:var(--gl);padding-right:var(--gr);padding-block:10px 0}
#topbar>*{pointer-events:auto}
.brand{font:400 21px/1 var(--font-display);color:var(--bulb);letter-spacing:.02em;text-shadow:0 2px 0 var(--candy-deep),0 4px 0 var(--ink);margin-right:4px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:18px;background:var(--ink-soft);border:2px solid var(--ink-3);color:var(--paper);font:800 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
button.stat{cursor:pointer}
.stat svg{width:20px;height:20px;color:var(--bulb);flex:none}
.stat.money{background:var(--bulb);border-color:var(--bulb-deep);color:var(--ink);font-weight:900}
.stat.money svg{color:var(--ink)}
.stat.money.neg{background:var(--candy);border-color:var(--candy-deep);color:var(--paper)}
.ctrl{margin-left:auto;display:flex;gap:6px}
.seg{display:inline-flex;height:36px;border-radius:18px;background:var(--ink-soft);border:2px solid var(--ink-3);overflow:hidden}
.seg button{width:36px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--paper)}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--bulb);color:var(--ink)}
.ibtn{width:36px;height:36px;border-radius:18px;background:var(--ink-soft);border:2px solid var(--ink-3);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:19px;height:19px}

#goal{align-self:flex-start;margin:8px var(--gr) 0 var(--gl);max-width:min(540px,calc(100% - var(--gl) - var(--gr)));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 12px 8px;background:var(--ink-soft);border:2px solid var(--ink-3);border-radius:14px;text-align:left;cursor:pointer;pointer-events:auto}
#goal .tag{font:400 11px/1 var(--font-display);color:var(--bulb);letter-spacing:.08em}
#goal .txt{font-weight:800}
#goal .rew{font-weight:900;color:var(--mint);white-space:nowrap}
#goal .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--ink-3);overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:var(--bulb);transition:width .4s}

#mid{flex:1;min-height:0;position:relative;pointer-events:none}
#mid>*{pointer-events:auto}
#toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - var(--gl) - var(--gr)));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none!important;z-index:3}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:100%;padding:8px 14px 8px 10px;border:0;border-radius:12px;background:var(--paper);color:var(--paper-ink);font-weight:800;text-align:left;box-shadow:0 4px 0 var(--drop);animation:pop .25s ease-out;cursor:pointer}
.toast i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ink-3)}
.toast.good i{background:var(--mint-deep)} .toast.bad i{background:var(--candy)} .toast.gold i{background:var(--bulb-deep)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96)}}

#coach{position:absolute;left:var(--gl);top:8px;width:min(340px,calc(100% - var(--gl) - var(--gr)));background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:14px 16px 16px;box-shadow:0 6px 0 var(--drop);z-index:2}
#coach h1{font:400 19px/1.1 var(--font-display);color:var(--candy-deep);margin:0 0 8px;text-wrap:balance}
#coach p{margin:0 0 8px;font-weight:700}
#coach ul{margin:0 0 12px;padding-left:18px;font-weight:700}
#coach li{margin:2px 0}

#panel{position:absolute;right:var(--gr);top:8px;width:280px;max-height:calc(100% - 16px);overflow:auto;background:var(--ink-2);border:2px solid var(--ink-3);border-radius:16px;padding:12px 14px 14px;box-shadow:0 6px 0 var(--drop);z-index:2}
#panel h2{font:400 16px/1.15 var(--font-display);color:var(--bulb);margin:0 36px 8px 0}
#panel .x{position:absolute;right:8px;top:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px;margin:8px 0 0}
.kv span{opacity:.82}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;opacity:.85;margin:6px 0 0}
.stepper{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.stepper output{min-width:86px;text-align:center;font:400 17px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stepper .lbl{flex:1;font-size:13px;opacity:.82}
.sq{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink-3);background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.sq svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:900;background:var(--ink-3);color:var(--paper);white-space:nowrap}
.pill.ok{background:var(--mint);color:var(--ink)} .pill.bad{background:var(--candy);color:var(--paper)} .pill.warn{background:var(--bulb);color:var(--ink)}
.meters{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px;margin-top:8px}
.meter{height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:4px}
.meter.need i{background:var(--bulb)}

.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--bulb);color:var(--ink);font:900 14px/1.1 var(--font-ui);box-shadow:0 3px 0 var(--bulb-deep);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bulb-deep)}
.btn.red{background:var(--candy);color:var(--paper);box-shadow:0 3px 0 var(--candy-deep)}
.btn.mint{background:var(--mint);color:var(--ink);box-shadow:0 3px 0 var(--mint-deep)}
.btn.line{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 var(--ink-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

#cam{position:absolute;left:var(--gl);bottom:8px;display:grid;grid-template-columns:36px 36px;gap:6px}
#toolbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:calc(100% - var(--gl) - var(--gr) - 96px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--ink-2);border:2px solid var(--ink-3);border-radius:14px;box-shadow:0 5px 0 var(--drop);z-index:1}
#toolbar .t{min-width:0;display:grid;gap:1px}
#toolbar .t b{font:400 14px/1.1 var(--font-display);color:var(--bulb)}
#toolbar .t span{font-size:12px;opacity:.85}
#toolbar .btn{padding:8px 11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
#toolbar .btn svg{width:15px;height:15px}

/* ticket tray */
#dock{background:var(--ink);border-top:5px dotted var(--bulb);pointer-events:auto}
#tray{display:flex;gap:8px;overflow-x:auto;padding-left:var(--gl);padding-right:var(--gr);padding-block:10px 4px;scrollbar-width:thin;scrollbar-color:var(--ink-3) transparent}
.card{flex:none;width:106px;border:0;border-radius:10px;padding:6px 6px 7px;display:grid;justify-items:center;gap:3px;background:var(--paper);color:var(--paper-ink);cursor:pointer;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 0 71%,#0000 97%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 71%,#0000 97%,#000) 100% 0/51% 100% no-repeat;
  mask:radial-gradient(circle 7px at 0 71%,#0000 97%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle 7px at 100% 71%,#0000 97%,#000) 100% 0/51% 100% no-repeat}
.card img{width:72px;height:72px;border-radius:8px;pointer-events:none}
.card .nm{font-weight:900;font-size:12.5px;line-height:1.1;text-align:center;min-height:28px;width:100%;display:flex;align-items:center;justify-content:center;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:anywhere}
.card .pr{width:100%;border-top:2px dashed var(--paper-2);padding-top:4px;text-align:center;font:400 12px/1 var(--font-display);color:var(--candy-deep);font-variant-numeric:tabular-nums}
.card[aria-pressed="true"]{background:var(--bulb)}
.card[aria-pressed="true"] .pr{border-top-color:var(--bulb-deep);color:var(--ink)}
.card.poor .pr{opacity:.45}
.card.locked{cursor:not-allowed}
.card.locked img{filter:grayscale(1);opacity:.4}
.card.locked .pr{color:var(--ink-3);font:900 11px/1 var(--font-ui)}
.card.staff{cursor:default}
.card .cnt{position:absolute;left:8px;top:8px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bulb);font:400 12px/22px var(--font-display);text-align:center;padding:0 5px}
.card .pm{display:flex;gap:6px}
.card .pm button{width:38px;height:26px;border-radius:8px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.card .pm button svg{width:13px;height:13px}
#tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:760px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr);padding-block:6px 8px}
#tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:5px 2px 4px;border-radius:10px;color:var(--paper);cursor:pointer;font:800 11.5px/1.1 var(--font-ui)}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-pressed="true"]{background:var(--bulb);color:var(--ink)}
#tabs .s{display:none}

#modal{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:var(--veil);padding:16px var(--gr) 16px var(--gl)}
#modal .box{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;background:var(--ink-2);border:2px solid var(--ink-3);border-radius:18px;padding:18px 18px 20px;box-shadow:0 8px 0 var(--drop);user-select:text;-webkit-user-select:text}
#modal h2{font:400 20px/1.1 var(--font-display);color:var(--bulb);margin:0 40px 12px 0;text-wrap:balance}
#modal h3{font:900 13px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--mint);margin:16px 0 6px}
#modal p{margin:0 0 8px}
#modal .x{position:absolute;right:10px;top:10px}
table.fin{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.fin th,table.fin td{padding:4px 0;text-align:right;font-weight:800}
table.fin th:first-child,table.fin td:first-child{text-align:left;font-weight:700}
table.fin thead th{font-size:12px;opacity:.75;border-bottom:2px solid var(--ink-3)}
table.fin tr.sum td{border-top:2px solid var(--ink-3);font:400 15px/1.4 var(--font-display);color:var(--bulb)}
table.fin .neg{color:var(--candy)}
ol.goals{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ol.goals li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--ink)}
ol.goals li.done{opacity:.6}
ol.goals li.now{outline:2px solid var(--bulb)}
ol.goals .n{font:400 13px/1 var(--font-display);color:var(--bulb)}
ol.goals .r{font-weight:900;color:var(--mint);white-space:nowrap}
#nogl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px var(--gr) 24px var(--gl);background:var(--ink);text-align:center}
#nogl div{max-width:420px}
#nogl b{display:block;font:400 22px/1.1 var(--font-display);color:var(--bulb);margin-bottom:10px}

@media (max-width:760px){
  .brand{display:none}
  .stat{height:34px;padding:0 10px 0 7px;font-size:13px}
  #panel{left:var(--gl);right:var(--gr);top:auto;bottom:8px;width:auto}
  #mid.sheet #cam,#mid.sheet #toolbar{display:none}
  #hud.sheet #tray{display:none}
  #panel{max-height:calc(100% - 16px)}
  #tabs .l{display:none}#tabs .s{display:inline}
  #toolbar{left:var(--gl);right:var(--gr);transform:none;max-width:none;bottom:52px;justify-content:space-between}
  #cam{grid-template-columns:repeat(4,36px)}
}
@media (max-width:420px){ #st-day .hm{display:none} .card{width:98px} }
@media (prefers-reduced-motion:reduce){ .toast{animation:none} #goal .bar i{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" tabindex="0" aria-label="Dein Freizeitpark in 3D"></canvas>
  <div id="hud">
    <header id="topbar">
      <div class="brand">Rummelinsel</div>
      <div class="stats">
        <button class="stat money" id="st-money" data-act="finance" title="Finanzen"><span data-ic="coin"></span><b id="v-money">0 €</b></button>
        <div class="stat" title="Gäste im Park"><span data-ic="people"></span><b id="v-guests">0</b></div>
        <button class="stat" id="st-rating" data-act="menu" title="Parkwertung"><span data-ic="star"></span><b id="v-rating">0</b></button>
        <div class="stat" id="st-day" title="Tag und Uhrzeit"><span id="ic-day" data-ic="sun"></span><b id="v-day">Tag 1</b></div>
      </div>
      <div class="ctrl">
        <div class="seg" role="group" aria-label="Spieltempo">
          <button data-act="speed" data-v="0" aria-label="Pause" title="Pause (Leertaste)"><span data-ic="pause"></span></button>
          <button data-act="speed" data-v="1" aria-label="Normales Tempo" title="Normal (1)"><span data-ic="play"></span></button>
          <button data-act="speed" data-v="2" aria-label="Doppeltes Tempo" title="Schnell (2)"><span data-ic="ff"></span></button>
          <button data-act="speed" data-v="4" aria-label="Vierfaches Tempo" title="Sehr schnell (3)"><span data-ic="fff"></span></button>
        </div>
        <button class="ibtn" data-act="menu" aria-label="Parkbüro" title="Parkbüro"><span data-ic="menu"></span></button>
      </div>
    </header>
    <button id="goal" data-act="goals" title="Alle Ziele ansehen">
      <span class="tag" id="goal-tag">Ziel</span><span class="txt" id="goal-txt"></span><span class="rew" id="goal-rew"></span>
      <span class="bar"><i id="goal-bar"></i></span>
    </button>
    <div id="mid">
      <div id="toasts" aria-live="polite"></div>
      <section id="coach" hidden></section>
      <aside id="panel" hidden></aside>
      <div id="cam">
        <button class="ibtn" data-act="camL" aria-label="Ansicht nach links drehen" title="Drehen (Q)"><span data-ic="rotl"></span></button>
        <button class="ibtn" data-act="camR" aria-label="Ansicht nach rechts drehen" title="Drehen (E)"><span data-ic="rotr"></span></button>
        <button class="ibtn" data-act="zin" aria-label="Näher heran" title="Heranzoomen"><span data-ic="plus"></span></button>
        <button class="ibtn" data-act="zout" aria-label="Weiter weg" title="Herauszoomen"><span data-ic="minus"></span></button>
      </div>
      <div id="toolbar" hidden></div>
    </div>
    <footer id="dock">
      <div id="tray" hidden></div>
      <nav id="tabs" aria-label="Bauen"></nav>
    </footer>
  </div>
  <div id="modal" hidden></div>
  <div id="nogl" hidden><div><b>Rummelinsel 3D</b>Die 3D-Grafik konnte nicht starten. Öffne die Seite mit Internetverbindung in einem aktuellen Browser mit WebGL.</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
if (!window.THREE) { $('#nogl').hidden = false; return; }
const T = window.THREE;

/* ================= helpers ================= */
const N = 40, HALF = N / 2, STEP = 1 / 30, DAY = 240, MAXG = 340;
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const idx = (x, y) => y * N + x, tX = (i) => i % N, tY = (i) => (i / N) | 0;
const wX = (x) => x - HALF + 0.5, wZ = (y) => y - HALF + 0.5;
const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const DIRS = [[0, 1], [-1, 0], [0, -1], [1, 0]];
const ENT = idx(HALF, N - 1);
const eur = (n) => Math.round(n).toLocaleString('de-DE') + ' €';
const eur2 = (n) => n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const TAU = Math.PI * 2;

/* ================= renderer ================= */
const canvas = $('#stage');
let renderer;
try { renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('#nogl').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const scene = new T.Scene();
scene.background = new T.Color(0x8fd3ff);
scene.fog = new T.Fog(0x8fd3ff, 70, 210);
const camera = new T.PerspectiveCamera(36, 1, 0.5, 600);
const hemi = new T.HemisphereLight(0xe6f6ff, 0x70905c, 0.62);
const sun = new T.DirectionalLight(0xfff0d2, 0.74);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 170;
scene.add(hemi, sun, sun.target);
const sunDir = new T.Vector3(0.4, 0.8, 0.4);

const MAT = new T.MeshLambertMaterial({ vertexColors: true });
const MAT_GLOW = new T.MeshBasicMaterial({ vertexColors: true });
const MAT_GHOST = new T.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.7 });
const MAT_INST = () => new T.MeshLambertMaterial({ vertexColors: true });

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c); t.anisotropy = maxAniso; return t;
}

/* ================= merged vertex-colour geometry ================= */
const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _v = new T.Vector3(), _s = new T.Vector3(), _c = new T.Color(), _n3 = new T.Matrix3();
function geoFrom(p, n, c) {
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(p, 3));
  g.setAttribute('normal', new T.Float32BufferAttribute(n, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(c, 3));
  return g;
}
class Builder {
  constructor() { this.p = []; this.n = []; this.c = []; this.gp = []; this.gn = []; this.gc = []; }
  add(geo, color, x = 0, y = 0, z = 0, o) {
    o = o || {};

/* ================= ride models ================= */
function seatAt(parent, x, y, z, ry) { const s = new T.Object3D(); s.position.set(x, y, z); if (ry) s.rotation.y = ry; parent.add(s); return s; }
function bulbRing(b, n, r, y, col) { for (let i = 0; i < n; i++) { const a = i / n * TAU; b.sph(0.045, col || K.bulb, Math.cos(a) * r, y, Math.sin(a) * r, { glow: true, seg: 6, seg2: 4 }); } }

function mBouncy() {
  const g = new T.Group(), b = new Builder();
  b.box(1.84, 0.06, 1.84, K.stoneD, 0, 0.03, 0);
  b.box(1.6, 0.3, 1.5, K.yel, 0, 0.21, -0.08);

  b.box(1.6, 0.85, 0.2, K.blue, 0, 0.75, -0.73);
  for (let i = -2; i <= 2; i++) b.box(0.22, 0.16, 0.2, i % 2 ? K.yel : K.red, i * 0.3, 1.25, -0.73);
  for (const [x, z] of [[-0.7, -0.73], [0.7, -0.73], [-0.7, 0.6], [0.7, 0.6]]) {
    b.cyl(0.18, 0.2, 1.3, K.red, x, 0.71, z); b.cone(0.25, 0.42, K.yel, x, 1.57, z); b.sph(0.05, K.bulb, x, 1.8, z, { glow: true, seg: 6, seg2: 4 });
  }
  b.box(1.0, 0.1, 0.34, K.blue, 0, 0.13, 0.8, { rx: 0.35 });
  g.add(b.mesh());
  const seats = [];
  for (let i = 0; i < 6; i++) { const s = seatAt(g, -0.42 + (i % 3) * 0.42, 0.36, -0.4 + ((i / 3) | 0) * 0.5); s.userData.ph = rnd(TAU); s.userData.sp = rnd(5, 7.5); seats.push(s); }

    for (const s of seats) { s.position.y = 0.36 + Math.abs(Math.sin(r.animT * s.userData.sp + s.userData.ph)) * 0.5 * r.spin; s.rotation.y += dt * 2 * r.spin; }
  } };
}

  for (const o of data.objs) {
    const d = DEFS[o[0]]; if (!d || !canPlace(d, o[1], o[2], o[3])) continue;
    const ob = placeObj(o[0], o[1], o[2], o[3], { nat: d.cat === 'deco' && !!o[4] });
    if (d.cat !== 'deco') { ob.price = +o[4] || 0; ob.count = o[5] || 0; ob.income = o[6] || 0; ob.open = !!o[7]; ob.broken = !!o[8]; ob.wear = o[9] || 0; }
  }
  for (let i = 0; i + 1 < data.lit.length; i += 2) if (tType[data.lit[i]] === 1) { litter[data.lit[i]] = data.lit[i + 1]; litterTotal += data.lit[i + 1]; }
  for (const k in STAFF) for (let i = 0; i < ((data.staff && data.staff[k]) || 0); i++) hire(k, true);
  scatterStaff();
  for (let i = 0; i < Math.min(data.guests || 0, MAXG - 30); i++) spawnGuest(true);
  sun.castShadow = S.shadows;
}
function newGame() {
  clearWorld();
  Object.assign(S, { money: 4000, loan: 0, time: DAY * 0.1, ticket: 5, rating: 55, goal: 0, exitAvg: 62, visitors: 0 });
  fin = { today: newFin(), yest: newFin() }; curDay = 0;
  for (let y = N - 1; y >= N - 9; y--) setPath(idx(HALF, y), true);
  for (let x = HALF - 4; x <= HALF + 4; x++) setPath(idx(x, N - 6), true);
  placeObj('carousel', HALF + 1, N - 5, 0);
  placeObj('fries', HALF - 1, N - 4, 3);
  placeObj('lamp', HALF + 1, N - 1, 0, { nat: true }); placeObj('lamp', HALF - 1, N - 7, 0, { nat: true });
  placeObj('flowers', HALF - 1, N - 1, 0, { nat: true }); placeObj('flowers', HALF - 1, N - 2, 0, { nat: true });
  for (let i = 0; i < 80; i++) {
    const x = rint(0, N - 1), y = rint(0, N - 1);
    if (Math.abs(x - HALF) < 8 && y > N - 14) continue;
    if (tType[idx(x, y)] === 0) placeObj(pick(['tree', 'tree', 'pine', 'palm']), x, y, 0, { nat: true });
  }
  for (const [x, y] of [[HALF - 3, N - 3], [HALF + 5, N - 3], [HALF - 5, N - 8], [HALF + 6, N - 8], [HALF - 2, N - 8]]) if (tType[idx(x, y)] === 0) placeObj('tree', x, y, 0, { nat: true });
  for (let i = 0; i < 9; i++) spawnGuest(true);
  sun.castShadow = S.shadows;
}

/* ================= main loop ================= */
let last = 0, acc = 0, uiT = 0, saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  if (S.speed > 0) {
    acc += rdt * S.speed; let n = 0;
    while (acc >= STEP && n < 14) { simStep(STEP); acc -= STEP; n++; }
    if (n === 14) acc = 0;
  }
  if (pathDirty) rebuildPaths();
  if (litterDirty) rebuildLitter();
  updateCamera(rdt); updateSky(); renderPeople(); renderIcons();
  for (const c of clouds) { c.position.x += c.userData.v * rdt; if (c.position.x > 150) c.position.x = -150; }
  uiT += rdt; if (uiT > 0.25 || uiDirty) { uiT = 0; uiDirty = false; refreshUI(); }
  saveT += rdt; if (saveT > 15) { saveT = 0; save(); }
  renderer.render(scene, camera);
}
function start(hot) {
  buildWorld(); makeThumbs(); resize();
  let data = hot && hot.save;
  if (!data) { try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { data = null; } }
  let loaded = false;
  if (data && data.v === 1 && Array.isArray(data.paths) && Array.isArray(data.objs)) { try { load(data); loaded = true; } catch (e) { loaded = false; } }
  if (!loaded) newGame();
  buildTabs(); renderTray(); renderCoach(); refreshUI();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.__park = { S, DEFS, cam, removeObj, fire, load, demolish, tType, toScreen: (x, z) => { _v.set(x, 0, z).project(camera); const r = canvas.getBoundingClientRect(); return [(_v.x * 0.5 + 0.5) * r.width + r.left, (-_v.y * 0.5 + 0.5) * r.height + r.top]; }, simStep, placeObj, setPath, hire, idx, newGame, save, serialize, setTool, select, get guests() { return guests; }, get builds() { return builds; }, get staff() { return staff; }, get fin() { return fin; } };
  requestAnimationFrame(frame);
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: serialize() })); } catch (e) { /* only present inside the viewer */ }
if (HOT && HOT.ready) HOT.ready(start); else start((HOT && HOT.data) || {});
})();
